<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Management System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f0f2f5;
        }

        .box {
            background: white;
            padding: 20px;
            max-width: 400px;
            margin: 0 auto;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .hidden {
            display: none !important;
        }

        input, button, select {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            box-sizing: border-box;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            border-radius: 4px;
        }

        button:hover {
            opacity: 0.9;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: white;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: left;
        }

        th {
            background-color: #f8f9fa;
        }

        .action-btns {
            display: flex;
            gap: 5px;
        }

        .btn-delete {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 5px 10px;
            cursor: pointer;
            font-size: 12px;
            border-radius: 4px;
            width: auto;
            margin-top: 0;
        }

        .btn-edit {
            background-color: #ffc107;
            color: #212529;
            border: none;
            padding: 5px 10px;
            cursor: pointer;
            font-size: 12px;
            border-radius: 4px;
            width: auto;
            margin-top: 0;
        }

        #diagnosticTerminal {
            background-color: #1e1e1e;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            padding: 10px;
            margin-top: 25px;
            border-radius: 4px;
            border: 1px solid #333;
            overflow-x: auto;
            text-align: left;
        }

        .diag-err {
            color: #ff3333;
            font-weight: bold;
        }

        .diag-success {
            color: #33ff33;
        }

        .low-stock {
            background-color: #f8d7da !important;
            color: #721c24;
            font-weight: bold;
        }

        .badge-alert {
            background: #dc3545;
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            margin-left: 5px;
            display: inline-block;
        }

        .search-bar {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        .dashboard {
            max-width: 900px;
            margin: 0 auto;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .dashboard-header button {
            width: auto;
            margin-top: 0;
            padding: 10px 20px;
            background-color: #6c757d;
        }

        .dashboard-content {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            align-items: flex-start;
        }

        .admin-panel {
            width: 300px;
            flex-shrink: 0;
            margin: 0;
        }

        .inventory-panel {
            flex: 1;
            min-width: 0;
        }

        .message {
            margin-top: 10px;
            padding: 10px;
            border-radius: 4px;
            display: none;
        }

        .success-message {
            display: block;
            background: #d4edda;
            color: #155724;
        }

        .error-message {
            display: block;
            background: #f8d7da;
            color: #721c24;
        }

        @media (max-width: 700px) {
            .dashboard-content {
                flex-direction: column;
            }

            .admin-panel {
                width: 100%;
            }

            .inventory-panel {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <!-- LOGIN / REGISTRATION -->
    <div id="authScreen" class="box">

        <h2 id="formTitle">🔐 System Login</h2>

        <input
            type="email"
            id="userEmail"
            placeholder="Email (admin@system.com)"
            autocomplete="email"
        >

        <input
            type="password"
            id="userPassword"
            placeholder="Password (password123)"
            autocomplete="current-password"
        > <form action="/register-endpoint" method="POST">
        <div class="form-group">
           
            <div id="restriction-msg" class="disabled-note">"</div>
        </div>

        <button type="submit">Submit Registration</button>
    </form>

        <select id="userRole" class="hidden">
            <option value="admin">Administrator (Full Control)</option>
            <option value="user">Standard User (Read-Only)</option>

        </select>
        <button id="mainBtn" type="button">Sign In</button>

        <p
            id="toggleLink"
            style="text-align:center; font-size:14px; margin-top:15px; cursor:pointer; color:#007bff;"
        >
            Don't have an account? Register here
        </p>

        <div id="authMessage" class="message"></div>

      
            </div>
        </div>

    </div>


    <!-- DASHBOARD -->
    <div id="dashboardScreen" class="hidden dashboard">

        <div class="dashboard-header">
            <div>
                <h2>📦 Inventory Management System</h2>
                <p>
                    Active User:
                    <strong id="userDisplay">None</strong>
                </p>
            </div>

            <button id="logoutBtn" type="button">
                Logout
            </button>
        </div>


        <div class="dashboard-content">

            <!-- ADMIN CONTROLS -->
            <div class="box admin-panel" id="adminControls">

                <h3>Add New Product</h3>

                <input
                    type="text"
                    id="prodName"
                    placeholder="Product Name"
                >

                <input
                    type="number"
                    id="prodQty"
                    placeholder="Quantity"
                    min="0"
                >

                <button id="addProductBtn" type="button">
                    Add to List
                </button>

                <div id="productMessage" class="message"></div>

            </div>


            <!-- INVENTORY -->
            <div class="inventory-panel">

                <h3>Current Inventory</h3>

                <input
                    type="text"
                    id="searchInput"
                    class="search-bar"
                    placeholder="🔍 Search products by name..."
                >

                <table>
                    <thead>
                        <tr>
                            <th>Product Name</th>
                            <th>Quantity</th>
                            <th id="actionsHeader">Actions</th>
                        </tr>
                    </thead>

                    <tbody id="inventoryTable"></tbody>
                </table>

            </div>

        </div>

    </div>


    <script>

        /* =====================================================
           DIAGNOSTIC SYSTEM
        ===================================================== */

        function appendLog(message, isError) {

            var el = document.getElementById("logContent");

            if (!el) {
                return;
            }

            var cssClass = isError
                ? "diag-err"
                : "diag-success";

            el.innerHTML +=
                "<br><span class='" +
                cssClass +
                "'>" +
                message +
                "</span>";
        }


        window.onerror = function(message, source, lineno) {

            appendLog(
                "❌ RUNTIME ERROR: " +
                message +
                " (Line " +
                lineno +
                ")",
                true
            );

            return false;
        };


        /* =====================================================
           DATA
        ===================================================== */

        var defaultAccounts = [
            {
                email: "admin@system.com",
                pass: "password123",
                role: "admin"
            }
        ];

        var accounts =
            JSON.parse(localStorage.getItem("accounts")) ||
            defaultAccounts;

        var inventory =
            JSON.parse(localStorage.getItem("inventory")) ||
            [];

        var isRegisterMode = false;
        var activeUser = null;


        /* =====================================================
           SAVE DATA
        ===================================================== */

        function saveAccounts() {

            localStorage.setItem(
                "accounts",
                JSON.stringify(accounts)
            );
        }


        function saveInventory() {

            localStorage.setItem(
                "inventory",
                JSON.stringify(inventory)
            );
        }


        /* =====================================================
           MESSAGE SYSTEM
        ===================================================== */

        function showMessage(elementId, message, type) {

            var element =
                document.getElementById(elementId);

            element.textContent = message;

            element.className =
                "message " +
                (type === "success"
                    ? "success-message"
                    : "error-message");
        }


        function hideMessage(elementId) {

            var element =
                document.getElementById(elementId);

            element.textContent = "";
            element.className = "message";
        }


        /* =====================================================
           LOGIN / REGISTER MODE
        ===================================================== */

        function switchToRegister() {

            isRegisterMode = true;

            document.getElementById("formTitle").innerText =
                "📝 Registration";

            document
                .getElementById("userRole")
                .classList.remove("hidden");

            document.getElementById("mainBtn").innerText =
                "Create Account";

            document.getElementById("toggleLink").innerText =
                "Back to Login";

            document.getElementById("userPassword").value = "";

            hideMessage("authMessage");

            appendLog(
                "🔄 Panel switched to REGISTER MODE.",
                false
            );
        }


        function switchToLogin() {

            isRegisterMode = false;

            document.getElementById("formTitle").innerText =
                "🔐 System Login";

            document
                .getElementById("userRole")
                .classList.add("hidden");

            document.getElementById("mainBtn").innerText =
                "Sign In";

            document.getElementById("toggleLink").innerText =
                "Don't have an account? Register here";

            hideMessage("authMessage");

            appendLog(
                "🔄 Panel switched to LOGIN MODE.",
                false
            );
        }


        /* =====================================================
           REGISTRATION
        ===================================================== */

        function handleRegister() {

            appendLog(
                "Processing registration...",
                false
            );

            var em =
                document
                    .getElementById("userEmail")
                    .value
                    .toLowerCase()
                    .trim();

            var pa =
                document
                    .getElementById("userPassword")
                    .value;

            var ro =
                document
                    .getElementById("userRole")
                    .value;


            /* Validate email */

            if (em === "") {

                showMessage(
                    "authMessage",
                    "Please enter your email.",
                    "error"
                );

                appendLog(
                    "❌ Registration failed: email is empty.",
                    true
                );

                return;
            }


            /* Validate password */

            if (pa === "") {

                showMessage(
                    "authMessage",
                    "Please enter a password.",
                    "error"
                );

                appendLog(
                    "❌ Registration failed: password is empty.",
                    true
                );

                return;
            }


            /* Password length */

            if (pa.length < 6) {

                showMessage(
                    "authMessage",
                    "Password must contain at least 6 characters.",
                    "error"
                );

                return;
            }


            /* Check duplicate */

            var existing = accounts.find(function(account) {

                return account.email === em;

            });


            if (existing) {

                showMessage(
                    "authMessage",
                    "This email is already registered.",
                    "error"
                );

                appendLog(
                    "❌ Registration failed: email already exists.",
                    true
                );

                return;
            }


            /* Create account */

            accounts.push({
                email: em,
                pass: pa,
                role: ro
            });


            saveAccounts();


            appendLog(
                "✅ Account successfully created.",
                false
            );


            showMessage(
                "authMessage",
                "Account registered successfully! You can now log in.",
                "success"
            );


            /* Clear fields */

            document.getElementById("userEmail").value = "";
            document.getElementById("userPassword").value = "";


            /* Return to login */

            switchToLogin();

        }


        /* =====================================================
           LOGIN
        ===================================================== */

        function handleLogin() {

            appendLog(
                "Processing login credentials...",
                false
            );

            var em =
                document
                    .getElementById("userEmail")
                    .value
                    .toLowerCase()
                    .trim();

            var pa =
                document
                    .getElementById("userPassword")
                    .value;


            if (em === "" || pa === "") {

                showMessage(
                    "authMessage",
                    "Please enter both email and password.",
                    "error"
                );

                appendLog(
                    "❌ Login failed: missing credentials.",
                    true
                );

                return;
            }


            var foundUser = null;


            for (var i = 0; i < accounts.length; i++) {

                if (
                    accounts[i].email === em &&
                    accounts[i].pass === pa
                ) {

                    foundUser = accounts[i];

                    break;
                }
            }


            if (foundUser === null) {

                showMessage(
                    "authMessage",
                    "Invalid email or password.",
                    "error"
                );

                appendLog(
                    "❌ Login failed: invalid credentials.",
                    true
                );

                return;
            }


            /* Login successful */

            activeUser = foundUser;


            document
                .getElementById("authScreen")
                .classList.add("hidden");


            document
                .getElementById("dashboardScreen")
                .classList.remove("hidden");


            document.getElementById("userDisplay").innerText =
                activeUser.email +
                " (" +
                activeUser.role +
                ")";


            /* ADMIN */

            if (activeUser.role === "admin") {

                document
                    .getElementById("adminControls")
                    .classList.remove("hidden");

                document
                    .getElementById("actionsHeader")
                    .classList.remove("hidden");

            }


            /* STANDARD USER */

            else {

                document
                    .getElementById("adminControls")
                    .classList.add("hidden");

                document
                    .getElementById("actionsHeader")
                    .classList.add("hidden");
            }


            appendLog(
                "✅ LOGIN SUCCESS: " +
                activeUser.email,
                false
            );


            renderInventory();

        }


        /* =====================================================
           LOGOUT
        ===================================================== */

        function handleLogout() {

            activeUser = null;


            document
                .getElementById("dashboardScreen")
                .classList.add("hidden");


            document
                .getElementById("authScreen")
                .classList.remove("hidden");


            document.getElementById("userEmail").value = "";
            document.getElementById("userPassword").value = "";


            appendLog(
                "🚪 User logged out successfully.",
                false
            );

        }


        /* =====================================================
           ADD PRODUCT
        ===================================================== */

        function addProduct() {

            if (!activeUser || activeUser.role !== "admin") {

                showMessage(
                    "productMessage",
                    "Only administrators can add products.",
                    "error"
                );

                return;
            }


            var name =
                document
                    .getElementById("prodName")
                    .value
                    .trim();

            var quantity =
                parseInt(
                    document
                        .getElementById("prodQty")
                        .value,
                    10
                );


            if (name === "") {

                showMessage(
                    "productMessage",
                    "Please enter a product name.",
                    "error"
                );

                return;
            }


            if (
                isNaN(quantity) ||
                quantity < 0
            ) {

                showMessage(
                    "productMessage",
                    "Please enter a valid quantity.",
                    "error"
                );

                return;
            }


            inventory.push({
                id: Date.now(),
                name: name,
                quantity: quantity
            });


            saveInventory();


            document.getElementById("prodName").value = "";
            document.getElementById("prodQty").value = "";


            showMessage(
                "productMessage",
                "Product added successfully.",
                "success"
            );


            appendLog(
                "📦 Product added: " +
                name +
                " (" +
                quantity +
                ")",
                false
            );


            renderInventory();

        }


        /* =====================================================
           EDIT PRODUCT
        ===================================================== */

        function editProduct(id) {

            if (!activeUser || activeUser.role !== "admin") {
                return;
            }


            var product = inventory.find(function(item) {

                return item.id === id;

            });


            if (!product) {
                return;
            }


            var newName =
                prompt(
                    "Enter new product name:",
                    product.name
                );


            if (newName === null) {
                return;
            }


            newName = newName.trim();


            if (newName === "") {

                alert("Product name cannot be empty.");

                return;
            }


            var newQuantity =
                prompt(
                    "Enter new quantity:",
                    product.quantity
                );


            if (newQuantity === null) {
                return;
            }


            newQuantity =
                parseInt(newQuantity, 10);


            if (
                isNaN(newQuantity) ||
                newQuantity < 0
            ) {

                alert("Invalid quantity.");

                return;
            }


            product.name = newName;
            product.quantity = newQuantity;


            saveInventory();
            renderInventory();


            appendLog(
                "✏️ Product updated: " +
                newName,
                false
            );

        }


        /* =====================================================
           DELETE PRODUCT
        ===================================================== */

        function deleteProduct(id) {

            if (!activeUser || activeUser.role !== "admin") {
                return;
            }


            var product =
                inventory.find(function(item) {

                    return item.id === id;

                });


            if (!product) {
                return;
            }


            var confirmed =
                confirm(
                    "Delete " +
                    product.name +
                    "?"
                );


            if (!confirmed) {
                return;
            }


            inventory =
                inventory.filter(function(item) {

                    return item.id !== id;

                });


            saveInventory();
            renderInventory();


            appendLog(
                "🗑️ Product deleted: " +
                product.name,
                false
            );

        }


        /* =====================================================
           RENDER INVENTORY
        ===================================================== */

        function renderInventory() {

            var table =
                document.getElementById("inventoryTable");

            var search =
                document
                    .getElementById("searchInput")
                    .value
                    .toLowerCase()
                    .trim();


            table.innerHTML = "";


            var filteredInventory =
                inventory.filter(function(product) {

                    return product.name
                        .toLowerCase()
                        .includes(search);

                });


            if (filteredInventory.length === 0) {

                var emptyRow =
                    document.createElement("tr");

                var emptyCell =
                    document.createElement("td");

                emptyCell.colSpan = 3;
                emptyCell.style.textAlign = "center";
                emptyCell.textContent =
                    "No products found.";

                emptyRow.appendChild(emptyCell);
                table.appendChild(emptyRow);

                return;
            }


            filteredInventory.forEach(function(product) {

                var row =
                    document.createElement("tr");


                /* Low stock */

                if (product.quantity <= 5) {
                    row.classList.add("low-stock");
                }


                /* Product name */

                var nameCell =
                    document.createElement("td");

                nameCell.textContent =
                    product.name;


                if (product.quantity <= 5) {

                    var badge =
                        document.createElement("span");

                    badge.className =
                        "badge-alert";

                    badge.textContent =
                        "LOW STOCK";

                    nameCell.appendChild(badge);
                }


                /* Quantity */

                var quantityCell =
                    document.createElement("td");

                quantityCell.textContent =
                    product.quantity;


                /* Actions */

                var actionsCell =
                    document.createElement("td");


                if (
                    activeUser &&
                    activeUser.role === "admin"
                ) {

                    var actionContainer =
                        document.createElement("div");

                    actionContainer.className =
                        "action-btns";


                    var editButton =
                        document.createElement("button");

                    editButton.className =
                        "btn-edit";

                    editButton.type = "button";
                    editButton.textContent = "Edit";

                    editButton.addEventListener(
                        "click",
                        function() {
                            editProduct(product.id);
                        }
                    );


                    var deleteButton =
                        document.createElement("button");

                    deleteButton.className =
                        "btn-delete";

                    deleteButton.type = "button";
                    deleteButton.textContent = "Delete";

                    deleteButton.addEventListener(
                        "click",
                        function() {
                            deleteProduct(product.id);
                        }
                    );


                    actionContainer.appendChild(editButton);
                    actionContainer.appendChild(deleteButton);

                    actionsCell.appendChild(actionContainer);

                }
                else {

                    actionsCell.textContent =
                        "Read Only";

                }


                row.appendChild(nameCell);
                row.appendChild(quantityCell);
                row.appendChild(actionsCell);

                table.appendChild(row);

            });

        }


        /* =====================================================
           EVENT LISTENERS
        ===================================================== */

        document.addEventListener(
            "DOMContentLoaded",
            function() {

                appendLog(
                    "⚙️ DOM loaded successfully.",
                    false
                );


                document
                    .getElementById("mainBtn")
                    .addEventListener(
                        "click",
                        function() {

                            if (isRegisterMode) {
                                handleRegister();
                            }
                            else {
                                handleLogin();
                            }

                        }
                    );


                document
                    .getElementById("toggleLink")
                    .addEventListener(
                        "click",
                        function() {

                            if (isRegisterMode) {
                                switchToLogin();
                            }
                            else {
                                switchToRegister();
                            }

                        }
                    );


                document
                    .getElementById("logoutBtn")
                    .addEventListener(
                        "click",
                        handleLogout
                    );


                document
                    .getElementById("addProductBtn")
                    .addEventListener(
                        "click",
                        addProduct
                    );


                document
                    .getElementById("searchInput")
                    .addEventListener(
                        "input",
                        renderInventory
                    );


                /* Press Enter to login/register */

                document
                    .getElementById("userPassword")
                    .addEventListener(
                        "keydown",
                        function(event) {

                            if (event.key === "Enter") {
                                document
                                    .getElementById("mainBtn")
                                    .click();
                            }

                        }
                    );


                renderInventory();


                appendLog(
                    "✅ All event listeners attached successfully.",
                    false
                );

            }
        );

    </script>

</body>
</html>
